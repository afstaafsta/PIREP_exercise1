<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Transmit PIREP (Expanded) - Page 5</title>
  <style>
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url("imagebackground6.jpeg") no-repeat center center fixed;
      background-size: cover;
      opacity: 0.5;
      z-index: -1;
    }
    .form-container {
      width: 692px; height: 754px;
      position: relative; z-index: 100;
      background: url("pirep.png") no-repeat;
      background-size: contain;
      margin: 0 auto; border: none;
    }
    .form-field {
      position: absolute; font-size: 14px;
      background-color: rgba(255,255,255,0.3);
      border: 1px solid transparent; z-index: 10;
      box-sizing: border-box; resize: none;
      overflow: auto; padding-left: 3.2ch;
      text-transform: uppercase;
    }
    .accountable-facility { top: 40px; left: 140px; width: 75px; height: 21px; padding-left: 0.8ch; }
    .pilot-report-type   { top: 41px; left: 413px; width: 68px; height: 21px; padding-left: 5px; }
    .populate-box {
      opacity: 0; position: absolute;
      top: 5px; left: 653px; width: 30px; height: 21px;
      cursor: pointer; z-index: 110;
    }
    .phenomena-location { top: 75px;  left: 146px; width: 233px; height: 19px; }
    .phenomena-time     { top: 109px; left: 144px; width: 82px;  height: 18px; }
    .flight-level       { top: 108px; left: 326px; width: 80px;  height: 21px; }
    .aircraft-type      { top: 108px; left: 498px; width: 88px;  height: 21px; }
    .sky-condition      { top: 143px; left: 144px; width: 480px; height: 20px; }
    .flight-visibility  { top: 177px; left: 144px; width: 480px; height: 20px; padding-left: 3.6ch; }
    .temperature        { top: 211px; left: 144px; width: 480px; height: 20px; }
    .wind-velocity      { top: 245px; left: 144px; width: 480px; height: 20px; padding-left: 3.6ch; }
    .turbulence         { top: 280px; left: 144px; width: 480px; height: 20px; }
    .icing              { top: 314px; left: 144px; width: 480px; height: 20px; padding-left: 2.7ch; }
    .pilot-remarks      { top: 348px; left: 144px; width: 480px; height: 33px; }
    .braking-action     { top: 397px; left: 144px; width: 480px; height: 33px; }
    .transmit-box, .next-box {
      position: absolute; width: 75px; height: 21px;
      text-align: center; font-size: 14px; line-height: 21px;
      font-weight: bold; color: black; background-color: white;
      cursor: pointer; z-index: 120; display: none;
    }
    .transmit-box { top: 590px; left: 505px; border: 2px solid red; }
    .next-box     { top: 590px; left: 590px; border: 2px solid blue; }
    #correctAnswer {
      display: none; margin-top: 20px;
      font-size: 48px; font-weight: bold;
      color: black; text-align: left; margin-left: 20px;
    }
    .cassette-container {
      width: 333px; height: 250px;
      background: url('cassette_tape.png') no-repeat center;
      background-size: contain;
      position: absolute; left: 50px; top: 100px;
      border: 1px solid #555; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 1;
    }
    .control-button {
      width: 50px; height: 50px; font-size: 18px; font-weight: bold;
      position: absolute; background: linear-gradient(to bottom,#666,#333);
      color: white; text-align: center; cursor: pointer;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
      border: none; user-select: none; transition: all .2s ease-in-out;
    }
    .control-button:hover { background: linear-gradient(to bottom,#999,#666); }
    #playButton { right: 210px; bottom: 50px; }
    #instructionAudio { display: none; }
    .clock-container {
      position: absolute; top: 10px; right: 100px; text-align: center; z-index: 999;
    }
    .clock-image { display: block; margin: 0 auto; width: 200px; height: auto; }
    .clock-label {
      font-size: 20px; font-weight: bold;
      color: black; margin-top: 5px;
    }
    .cassette-label {
      position: absolute; top: -80px; left: 0;
      width: 100%; text-align: center;
      font-size: 36px; font-weight: bold; color: black;
    }
  </style>
</head>
<body>
  <div class="clock-container">
    <img src="e_0230Z.png" class="clock-image" alt="Clock">
    
  </div>

  <form id="pirepForm">
    <div class="form-container">
      <!-- Accountable Facility -->
      <textarea name="accountableFacility" class="form-field accountable-facility" maxlength="4"></textarea>
      <select name="pilotReportType" class="form-field pilot-report-type">
        <option value="UA" selected>UA</option>
        <option value="UUA">UUA</option>
      </select>

      <!-- Invisible “A” populate button -->
      <div id="populateBox" class="populate-box" onclick="populateAnswer()">A</div>

      <textarea name="phenomenaLocation" class="form-field phenomena-location"></textarea>
      <textarea name="phenomenaTime" class="form-field phenomena-time" maxlength="4"></textarea>
      <textarea name="flightLevel" class="form-field flight-level" maxlength="3"></textarea>
      <textarea name="aircraftType" class="form-field aircraft-type" maxlength="4"></textarea>
      <textarea name="skyCondition" class="form-field sky-condition"></textarea>

      <textarea name="flightVisibility" class="form-field flight-visibility"></textarea>
      <textarea name="temperature" class="form-field temperature"></textarea>
      <textarea name="windVelocity" class="form-field wind-velocity"></textarea>
      <textarea name="turbulence" class="form-field turbulence"></textarea>
      <textarea name="icing" class="form-field icing"></textarea>
      <textarea name="pilotRemarks" class="form-field pilot-remarks"></textarea>
      <textarea name="brakingAction" class="form-field braking-action"></textarea>

      <div id="transmitBox" class="transmit-box" onclick="newPilotReport()">Transmit</div>
      <div id="nextBox" class="next-box" onclick="goToNextPage()">Next</div>
    </div>
  </form>

  <div id="correctAnswer"></div>

  <div class="cassette-container">
    <div id="cassetteLabel" class="cassette-label">PIREP 5</div>
    <button type="button" id="playButton" class="control-button">▶️</button>
  </div>

  <audio id="instructionAudio" src="rob_audio5static.mp3" preload="auto"></audio>

  <script>
    let populateClickCount = 0;

    function populateAnswer() {
      const answerValues = {
        accountableFacility: "MCG",
        pilotReportType:      "UA",
        phenomenaLocation:    "MCG360005",
        phenomenaTime:        "0230",
        flightLevel:          "015",
        aircraftType:         "BE10",
        skyCondition:         "BKN017",
        flightVisibility:     "FV05SM HZ",
        turbulence:           "NEG",
        icing:                "NEG"
      };

      if (populateClickCount === 0) {
        // 1st click: fill required fields
        Object.keys(answerValues).forEach(name => {
          document.querySelector(`[name="${name}"]`).value = answerValues[name];
        });
        populateClickCount++;
      }
      else if (populateClickCount === 1) {
        // 2nd click: show Transmit
        document.getElementById("transmitBox").style.display = "block";
        populateClickCount++;
      }
    }

    // On manual input: uppercase, hide answer/next, then checkCompletion
    document.querySelectorAll(".form-field").forEach(f => {
      f.addEventListener("input", () => {
        const s = f.selectionStart, e = f.selectionEnd;
        f.value = f.value.toUpperCase();
        f.setSelectionRange(s, e);

        document.getElementById("correctAnswer").style.display = "none";
        document.getElementById("nextBox").style.display = "none";

        checkCompletion();
      });
    });

    // Show Transmit if all required fields correct AND extras are empty
    function checkCompletion() {
      const required = {
        accountableFacility: "MCG",
        pilotReportType:      "UA",
        phenomenaLocation:    "MCG360005",
        phenomenaTime:        "0230",
        flightLevel:          "015",
        aircraftType:         "BE10",
        skyCondition:         "BKN017",
        flightVisibility:     "FV05SM HZ",
        turbulence:           "NEG",
        icing:                "NEG"
      };
      // additional blank fields that must remain empty
      const extras = ["temperature","windVelocity","pilotRemarks","brakingAction"];
      
      const allRequiredCorrect = Object.keys(required).every(name => {
        const el = document.querySelector(`[name="${name}"]`);
        return el && el.value.trim().toUpperCase() === required[name];
      });
      const extrasEmpty = extras.every(name => {
        const el = document.querySelector(`[name="${name}"]`);
        return el && el.value.trim() === "";
      });

      document.getElementById("transmitBox").style.display =
        (allRequiredCorrect && extrasEmpty) ? "block" : "none";
    }

    function newPilotReport() {
      document.getElementById("correctAnswer").innerText =
        "MCG UA /OV MCG360005/TM 0230/FL015/TP BE10/SK BKN017/WX FV05SM HZ/TB NEG/IC NEG";
      document.getElementById("correctAnswer").style.display = "block";
      document.getElementById("nextBox").style.display = "block";
      document.getElementById("transmitBox").style.display = "none";
    }

    // Audio & Play button logic
    const audio = document.getElementById("instructionAudio");
    const playButton = document.getElementById("playButton");
    audio.load();
    audio.addEventListener("error", e => console.error("Audio error:", e));
    playButton.addEventListener("click", () => {
      audio.play().then(() => playButton.disabled = true)
                 .catch(err => console.error(err));
    });
    audio.addEventListener("ended", () => playButton.disabled = false);

    function goToNextPage() {
      window.location.href = "page6.htm";
    }
  </script>
</body>
</html>
