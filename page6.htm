<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Transmit PIREP (Expanded) - Page 6</title>
  <style>
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url("imagebackground8.avif") no-repeat center center fixed;
      background-size: cover;
      opacity: 0.5;
      z-index: -1;
    }
    .form-container { width: 692px; height: 754px; position: relative; z-index: 100; background: url("pirep.png") no-repeat; background-size: contain; margin: 0 auto; }
    .form-field { position: absolute; font-size: 14px; background-color: rgba(255,255,255,0.3); border: 1px solid transparent; z-index: 10; box-sizing: border-box; resize: none; overflow: auto; text-transform: uppercase; padding-left: 3.2ch; }
    .accountable-facility { top: 40px; left: 140px; width: 75px; height: 21px; padding-left: 0.8ch; }
    .pilot-report-type { top: 41px; left: 413px; width: 68px; height: 21px; text-align: left; padding-left: 5px; }
    .populate-box { opacity: 0; position: absolute; top: 5px; left: 653px; width: 30px; height: 21px; font-size: 14px; font-weight: bold; color: black; background-color: #ddd; border: 1px solid #ccc; cursor: pointer; z-index: 110; }
    .phenomena-location { top: 75px; left: 146px; width: 233px; height: 19px; }
    .phenomena-time { top: 109px; left: 144px; width: 82px; height: 18px; }
    .flight-level { top: 108px; left: 326px; width: 80px; height: 21px; }
    .aircraft-type { top: 108px; left: 498px; width: 88px; height: 21px; }
    .sky-condition { top: 143px; left: 144px; width: 480px; height: 20px; }
    .flight-visibility { top: 177px; left: 144px; width: 480px; height: 20px; padding-left: 3.6ch; }
    .temperature { top: 211px; left: 144px; width: 480px; height: 20px; }
    .wind-velocity { top: 245px; left: 144px; width: 480px; height: 20px; padding-left: 3.6ch; }
    .turbulence { top: 280px; left: 144px; width: 480px; height: 20px; }
    .icing { top: 314px; left: 144px; width: 480px; height: 20px; padding-left: 2.7ch; }
    .pilot-remarks { top: 348px; left: 144px; width: 480px; height: 33px; }
    .braking-action { top: 397px; left: 144px; width: 480px; height: 33px; }
    .transmit-box { position: absolute; top: 590px; left: 505px; width: 75px; height: 21px; border: 2px solid red; text-align: center; font-size: 14px; line-height: 21px; font-weight: bold; background-color: white; display: none; cursor: pointer; z-index: 120; }
    .next-box { position: absolute; top: 590px; left: 590px; width: 75px; height: 21px; border: 2px solid blue; text-align: center; font-size: 14px; line-height: 21px; font-weight: bold; background-color: white; display: none; cursor: pointer; z-index: 120; }
    #correctAnswer { display: none; margin-top: 20px; font-size: 48px; font-weight: bold; color: black; margin-left: 20px; }
    .cassette-container { width: 333px; height: 250px; background: url('cassette_tape.png') no-repeat center; background-size: contain; position: absolute; left: 50px; top: 100px; border: 1px solid #555; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index:1; }
    .control-button { width: 50px; height: 50px; font-size: 18px; font-weight: bold; position: absolute; background: linear-gradient(to bottom, #666, #333); color: white; text-align: center; cursor: pointer; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); border:none; user-select:none; transition: all 0.2s ease-in-out; }
    .control-button:hover { background: linear-gradient(to bottom, #999, #666); }
    #playButton { right: 210px; bottom: 50px; }
    #instructionAudio { display: none; }
    .clock-container { position: absolute; top: 10px; right: 100px; text-align: center; z-index:999; }
    .clock-image { display: block; margin:0 auto; width:200px; }
    .clock-label { font-size:20px; font-weight:bold; color:black; margin-top:5px; }
    .cassette-label { position: absolute; top: -80px; left:0; width:100%; text-align:center; font-size:36px; font-weight:bold; color:black; }
  </style>
</head>
<body>
  <div class="clock-container">
    <img src="e_2340Z.png" alt="Clock" class="clock-image">
    
  </div>
  <form id="pirepForm">
    <div class="form-container">
      <!-- Accountable Facility -->
      <textarea name="accountableFacility" class="form-field accountable-facility" maxlength="4"></textarea>
      <select name="pilotReportType" class="form-field pilot-report-type">
        <option value="UA" selected>UA</option>
        <option value="UUA">UUA</option>
      </select>
      <div id="populateBox" class="populate-box">A</div>
      <textarea name="phenomenaLocation" class="form-field phenomena-location"></textarea>
      <textarea name="phenomenaTime" class="form-field phenomena-time" maxlength="4"></textarea>
      <textarea name="flightLevel" class="form-field flight-level" maxlength="3"></textarea>
      <textarea name="aircraftType" class="form-field aircraft-type" maxlength="4"></textarea>
      <textarea name="skyCondition" class="form-field sky-condition"></textarea>
      <textarea name="flightVisibility" class="form-field flight-visibility"></textarea>
      <textarea name="temperature" class="form-field temperature"></textarea>
      <textarea name="windVelocity" class="form-field wind-velocity"></textarea>
      <textarea name="turbulence" class="form-field turbulence"></textarea>
      <textarea name="icing" class="form-field icing"></textarea>
      <textarea name="pilotRemarks" class="form-field pilot-remarks"></textarea>
      <textarea name="brakingAction" class="form-field braking-action"></textarea>
      <div id="transmitBox" class="transmit-box" onclick="newPilotReport()">Transmit</div>
      <div id="nextBox" class="next-box" onclick="goToNextPage()">Next</div>
    </div>
  </form>
  <div id="correctAnswer"></div>
  <div class="cassette-container">
    <div id="cassetteLabel" class="cassette-label">PIREP 6</div>
    <button id="playButton" class="control-button">▶️</button>
  </div>
  <audio id="instructionAudio" src="simon_audio6static.mp3"></audio>
  <script>
    let populateClickCount = 0;
    const requiredValues = {
      accountableFacility: "AKN",
      pilotReportType: "UA",
      phenomenaLocation: "AKN",
      phenomenaTime: "2340",
      flightLevel: "240",
      aircraftType: "DH8A",
      skyCondition: "OVCUNKN-TOP200/ SKC",
      temperature: "M47",
      windVelocity: "04587KT",
      turbulence: "NEG"
    };
    const extraFields = [
      'flightVisibility','icing','pilotRemarks','brakingAction'
    ];
    function populateAnswer() {
      if (populateClickCount === 0) {
        Object.keys(requiredValues).forEach(field => {
          let el = document.querySelector(`[name="${field}"]`);
          if (el) el.value = requiredValues[field];
        });
        populateClickCount++;
        checkCompletion();
      } else if (populateClickCount === 1) {
        showFinal();
        populateClickCount++;
      }
    }
    document.getElementById("populateBox").addEventListener("click", populateAnswer);
    document.querySelectorAll(".form-field").forEach(f => {
      f.addEventListener("input", () => { f.value = f.value.toUpperCase(); checkCompletion(); });
    });
    function checkCompletion() {
      let allCorrect = Object.keys(requiredValues).every(k => {
        let el = document.querySelector(`[name="${k}"]`);
        return el && el.value.trim().toUpperCase() === requiredValues[k];
      });
      let extrasEmpty = extraFields.every(f => {
        let el = document.querySelector(`[name="${f}"]`);
        return el && el.value.trim() === "";
      });
      document.getElementById("transmitBox").style.display = (allCorrect && extrasEmpty) ? 'block' : 'none';
    }
    function showFinal() {
      document.getElementById("correctAnswer").innerText =
        "AKN UA /OV AKN/TM 2340/FL240/TP DH8A/SK OVCUNKN-TOP200/ SKC/TA M47/WV 04587KT/TB NEG";
      document.getElementById("correctAnswer").style.display = "block";
      document.getElementById("transmitBox").style.display = "none";
      document.getElementById("nextBox").style.display = "block";
    }
    function newPilotReport() {
      showFinal();
    }
    function goToNextPage() {
      window.location.href = "page7.htm";
    }
    var audio = document.getElementById("instructionAudio");
    var playButton = document.getElementById("playButton");
    playButton.addEventListener("click", () => { if (audio.paused) { audio.play(); playButton.disabled = true; }});
    audio.addEventListener("ended", () => { playButton.disabled = false; playButton.innerText = "▶️"; });
  </script>
</body>
</html>
