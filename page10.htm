<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Transmit PIREP (Expanded) - Page 10</title>
  <style>
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url("pirep_boneyard1.jpeg") no-repeat center center fixed;
      background-size: cover;
      opacity: 0.5;
      z-index: -1;
    }
    .form-container {
      width: 692px; height: 754px;
      position: relative; z-index: 100;
      background: url("pirep.png") no-repeat;
      background-size: contain;
      margin: 0 auto; border: none;
    }
    .form-field {
      position: absolute;
      font-size: 14px;
      background-color: rgba(255,255,255,0.3);
      border: 1px solid transparent;
      z-index: 10;
      box-sizing: border-box;
      resize: none;
      overflow: auto;
      padding-left: 3.2ch;
      text-transform: uppercase;
    }
    .accountable-facility { top: 40px; left: 140px; width: 75px; height: 21px; padding-left: 0.8ch; }
    .pilot-report-type  { top: 41px; left: 413px; width: 68px; height: 21px; text-align: left; padding-left: 5px; }
    .populate-box       { opacity: 0; position: absolute; top: 5px; left: 653px; width: 30px; height: 21px; cursor: pointer; z-index: 110; }
    .phenomena-location { top: 75px; left: 146px; width: 233px; height: 19px; }
    .phenomena-time     { top: 109px; left: 144px; width: 82px; height: 18px; }
    .flight-level       { top: 108px; left: 326px; width: 80px; height: 21px; }
    .aircraft-type      { top: 108px; left: 498px; width: 88px; height: 21px; }
    .sky-condition      { top: 143px; left: 144px; width: 480px; height: 20px; }
    .flight-visibility  { top: 177px; left: 144px; width: 480px; height: 20px; }
    .temperature        { top: 211px; left: 144px; width: 480px; height: 20px; }
    .wind-velocity      { top: 245px; left: 144px; width: 480px; height: 20px; }
    .turbulence         { top: 280px; left: 144px; width: 480px; height: 20px; }
    .icing              { top: 314px; left: 144px; width: 480px; height: 20px; }
    .pilot-remarks      { top: 348px; left: 144px; width: 480px; height: 33px; }
    .braking-action     { top: 397px; left: 144px; width: 480px; height: 33px; }
    .transmit-box {
      position: absolute; top: 590px; left: 505px;
      width: 75px; height: 21px;
      border: 2px solid red;
      text-align: center; font-size: 14px;
      line-height: 21px; font-weight: bold;
      background-color: white;
      display: none; cursor: pointer; z-index: 120;
    }
    .next-box {
      position: absolute; top: 590px; left: 590px;
      width: 75px; height: 21px;
      border: 2px solid blue;
      text-align: center; font-size: 14px;
      line-height: 21px; font-weight: bold;
      background-color: white;
      display: none; cursor: pointer; z-index: 120;
    }
    #correctAnswer {
      display: none;
      margin-top: 20px;
      font-size: 48px;
      font-weight: bold;
      color: black;
      text-align: left;
      margin-left: 20px;
    }
    .cassette-container {
      width: 333px; height: 250px;
      background: url('cassette_tape.png') no-repeat center;
      background-size: contain;
      position: absolute; left: 50px; top: 100px;
      border: 1px solid #555;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
      z-index: 1;
    }
    .control-button {
      width: 50px; height: 50px;
      font-size: 18px; font-weight: bold;
      position: absolute;
      background: linear-gradient(to bottom, #666, #333);
      color: white; text-align: center;
      cursor: pointer;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
      transition: all 0.2s ease-in-out;
      border: none; user-select: none;
    }
    .control-button:hover { background: linear-gradient(to bottom, #999, #666); }
    #playButton        { right: 210px; bottom: 50px; }
    #instructionAudio  { display: none; }
    .clock-container   { position: absolute; top: 10px; right: 100px; text-align: center; z-index: 999; }
    .clock-image       { display: block; margin: 0 auto; width: 200px; height: auto; }
    .clock-label       { font-size: 20px; font-weight: bold; color: black; margin-top: 5px; }
    .cassette-label    { position: absolute; top: -80px; left: 0; width: 100%; text-align: center; font-size: 36px; font-weight: bold; color: black; }
  </style>
</head>
<body>
  <div class="clock-container">
    <img src="e_1905Z.png" alt="Clock" class="clock-image">
    
  </div>

  <form id="pirepForm">
    <div class="form-container">
      <!-- Accountable Facility -->
      <textarea name="accountableFacility" class="form-field accountable-facility" maxlength="4"></textarea>
      <select name="pilotReportType" class="form-field pilot-report-type">
        <option value="UA" selected>UA</option>
        <option value="UUA">UUA</option>
      </select>
      <div id="populateBox" class="populate-box">A</div>

      <textarea name="phenomenaLocation" class="form-field phenomena-location"></textarea>
      <textarea name="phenomenaTime"     class="form-field phenomena-time" maxlength="4"></textarea>
      <textarea name="flightLevel"       class="form-field flight-level" maxlength="3"></textarea>
      <textarea name="aircraftType"      class="form-field aircraft-type" maxlength="4"></textarea>
      <textarea name="skyCondition"      class="form-field sky-condition"></textarea>
      <textarea name="flightVisibility"  class="form-field flight-visibility"></textarea>
      <textarea name="temperature"       class="form-field temperature"></textarea>>
      <textarea name="windVelocity"      class="form-field wind-velocity"></textarea>
      <textarea name="turbulence"        class="form-field turbulence"></textarea>
      <textarea name="icing"             class="form-field icing"></textarea>
      <textarea name="pilotRemarks"      class="form-field pilot-remarks"></textarea>
      <textarea name="brakingAction"     class="form-field braking-action"></textarea>

      <div id="transmitBox" class="transmit-box" onclick="newPilotReport()">Transmit</div>
      <div id="nextBox"     class="next-box"     onclick="goToNextPage()">Next</div>
    </div>
  </form>

  <div id="correctAnswer"></div>

  <div class="cassette-container">
    <div id="cassetteLabel" class="cassette-label">PIREP 10</div>
    <button id="playButton" class="control-button">▶️</button>
  </div>

  <audio id="instructionAudio" src="mandla_audio10static2.1.mp3"></audio>

  <script>
    const VALID_REMARKS_1 = "LLWS +/-15KT 005-SFC DURD";
    const VALID_REMARKS_2 = "LLWS +/-15KT SFC-005 DURD";
    const requiredFields = {
      accountableFacility: "PAQ",
      pilotReportType:     "UUA",
      phenomenaLocation:   "PAQ",
      phenomenaTime:       "1905",
      flightLevel:         "005",
      aircraftType:        "C172",
      skyCondition:        "SCT017",
      turbulence:          "MOD-OCNL SEV"
    };
    const optionalFieldNames = [
      "flightVisibility","temperature",
      "windVelocity","icing","brakingAction"
    ];

    function isValidRemarks(str) {
      const val = str.trim().toUpperCase();
      return val === VALID_REMARKS_1 || val === VALID_REMARKS_2;
    }

    let populateClickCount = 0;
    function populateAnswer() {
      // fill required
      document.querySelector("[name='accountableFacility']").value = "PAQ";
      document.querySelector("[name='pilotReportType']").value     = "UUA";
      document.querySelector("[name='phenomenaLocation']").value  = "PAQ";
      document.querySelector("[name='phenomenaTime']").value      = "1905";
      document.querySelector("[name='flightLevel']").value        = "005";
      document.querySelector("[name='aircraftType']").value       = "C172";
      document.querySelector("[name='skyCondition']").value       = "SCT017";
      document.querySelector("[name='turbulence']").value         = "MOD-OCNL SEV";

      // clear other optional
      optionalFieldNames.forEach(name => {
        document.querySelector(`[name='${name}']`).value = "";
      });

      const remarksField   = document.querySelector("[name='pilotRemarks']");
      const correctAnswerEl= document.getElementById("correctAnswer");

      if (populateClickCount === 0) {
        remarksField.value = VALID_REMARKS_1;
        correctAnswerEl.style.display = "none";

      } else if (populateClickCount === 1) {
        correctAnswerEl.innerText =
          "PAQ UUA /OV PAQ/TM 1905/FL005/TP C172/SK SCT017 /TB MOD-OCNL SEV/RM " +
          remarksField.value.toUpperCase();
        correctAnswerEl.style.display = "block";

      } else if (populateClickCount === 2) {
        correctAnswerEl.style.display = "none";
        remarksField.value = VALID_REMARKS_2;

      } else if (populateClickCount === 3) {
        correctAnswerEl.innerText =
          "PAQ UUA /OV PAQ/TM 1905/FL005/TP C172/SK SCT017 /TB MOD-OCNL SEV/RM " +
          remarksField.value.toUpperCase();
        correctAnswerEl.style.display = "block";
        document.getElementById("nextBox").style.display = "block";
      }

      populateClickCount++;
      checkAllFields();
    }
    document.getElementById("populateBox").addEventListener("click", populateAnswer);

    function newPilotReport() {
      const remarksVal     = document.querySelector("[name='pilotRemarks']").value.toUpperCase().trim();
      const correctAnswerEl= document.getElementById("correctAnswer");
      if (isValidRemarks(remarksVal)) {
        correctAnswerEl.innerText =
          "PAQ UUA /OV PAQ/TM 1905/FL005/TP C172/SK SCT017 /TB MOD-OCNL SEV/RM " +
          remarksVal;
        correctAnswerEl.style.display = "block";
        document.getElementById("nextBox").style.display     = "block";
        document.getElementById("transmitBox").style.display = "none";
      } else {
        alert("Remarks not recognized. Must be one of the two LLWS +/-15KT options.");
      }
    }

    function checkAllFields() {
      let ok = true;
      for (let name in requiredFields) {
        const el = document.querySelector(`[name="${name}"]`);
        if (!el || el.value.trim().toUpperCase() !== requiredFields[name]) {
          ok = false; break;
        }
      }
      if (ok) {
        const rem = document.querySelector("[name='pilotRemarks']").value.trim().toUpperCase();
        if (!isValidRemarks(rem)) ok = false;
      }
      if (ok) {
        optionalFieldNames.forEach(name => {
          if (document.querySelector(`[name='${name}']`).value.trim() !== "") ok = false;
        });
      }
      document.getElementById("transmitBox").style.display = ok ? "block" : "none";
    }

    document.querySelectorAll(".form-field").forEach(el => {
      el.addEventListener("input", checkAllFields);
      el.addEventListener("change", checkAllFields);
    });
    checkAllFields();

    const audio      = document.getElementById("instructionAudio"),
          playButton = document.getElementById("playButton");
    playButton.addEventListener("click", () => {
      if (audio.paused || audio.ended) {
        audio.play();
        playButton.disabled = true;
      }
    });
    audio.addEventListener("ended", () => {
      playButton.disabled = false;
      playButton.innerText = "▶️";
    });
    function goToNextPage() {
      window.location.href = "page10b.htm";
    }
  </script>
</body>
</html>
